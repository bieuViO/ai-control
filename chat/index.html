<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3d91">
<title>Trợ lý AI VNPT Chơn Thành</title>
<meta name="description" content="Hỏi nhanh về hóa đơn điện tử, chữ ký số và thuế hộ kinh doanh 2026 cùng trợ lý AI của VNPT Chơn Thành.">
<style>
:root{--blue:#0a3d91;--blue2:#1565c0;--bg:#eef3fb;--card:#fff;--text:#1b2a41;--mute:#6b7a90;--line:#dbe4f2;--bot:#fff;--me:#0a3d91}
@media (prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16213a;--text:#e8eefc;--mute:#9db0cf;--line:#26355a;--bot:#1d2b4a;--me:#1565c0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:var(--card)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-weight:700}
header h1{font-size:16px;margin:0;line-height:1.2}
header small{opacity:.85;font-size:12px}
header a.call{margin-left:auto;background:#fff;color:var(--blue);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:20px;white-space:nowrap}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);-webkit-overflow-scrolling:touch}
.m{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px #0001}
.m.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.note{align-self:center;font-size:12px;color:var(--mute);text-align:center;max-width:92%}
.dots{display:inline-flex;gap:4px;padding:2px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--bg);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--blue2);border-radius:18px;padding:8px 12px;font-size:14px;cursor:pointer}
@media (prefers-color-scheme:dark){#chips button{color:#9ec5ff}}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--text);max-height:110px;outline:none}
textarea:focus{border-color:var(--blue2)}
button.send{border:0;background:var(--blue);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none}
button.send:disabled{opacity:.5}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:0 12px 8px;background:var(--card)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="av">AI</div>
    <div><h1>Trợ lý AI VNPT Chơn Thành</h1><small>Hóa đơn điện tử · Chữ ký số · Thuế HKD 2026</small></div>
    <a class="call" href="tel:0918203603" aria-label="Gọi hotline">📞 Gọi</a>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="f" autocomplete="off">
    <textarea id="t" rows="1" maxlength="500" placeholder="Nhập câu hỏi của anh/chị…" aria-label="Tin nhắn"></textarea>
    <button class="send" id="s" aria-label="Gửi">➤</button>
  </form>
  <div class="foot">Đây là trợ lý AI, có thể chưa chính xác tuyệt đối. Vui lòng không gửi CCCD, mật khẩu, mã OTP. Số điện thoại anh/chị để lại chỉ dùng để VNPT Chơn Thành liên hệ tư vấn.</div>
</div>
<script>
(function(){
'use strict';
// === CẤU HÌNH: dán URL Apps Script (kết thúc bằng /exec) vào đây ===
var BACKEND_URL = '';
var HOTLINE = '0918 203 603';

var log = document.getElementById('log'), f = document.getElementById('f'),
    t = document.getElementById('t'), s = document.getElementById('s'), chips = document.getElementById('chips');
var busy = false;

// Mã khách ẩn danh (lưu trên máy khách; nếu trình duyệt chặn lưu thì dùng mã tạm)
var sid = '';
try { sid = localStorage.getItem('abh_sid') || ''; } catch (e) {}
if (!sid) {
  sid = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem('abh_sid', sid); } catch (e) {}
}

function add(text, who) {
  var d = document.createElement('div');
  d.className = 'm ' + who;
  d.textContent = text;            // textContent: chống chèn HTML
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function note(text) {
  var d = document.createElement('div'); d.className = 'note'; d.textContent = text; log.appendChild(d);
}
function typing() {
  var d = document.createElement('div'); d.className = 'm bot';
  d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function setBusy(b) { busy = b; s.disabled = b; t.disabled = b; if (!b) t.focus(); }

function send(text) {
  text = (text || '').replace(/\s+/g, ' ').trim();
  if (!text || busy) return;
  chips.style.display = 'none';
  add(text, 'me');
  t.value = ''; t.style.height = 'auto';
  if (!BACKEND_URL) { add('Chatbot đang bảo trì. Anh/chị vui lòng gọi hotline ' + HOTLINE + ' ạ.', 'bot'); return; }
  setBusy(true);
  var w = typing();
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
  // text/plain để tránh preflight CORS với Apps Script
  fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ sid: sid, msg: text }), signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) { w.remove(); add(j && j.reply ? j.reply : 'Xin lỗi anh/chị, em chưa trả lời được. Anh/chị gọi hotline ' + HOTLINE + ' giúp em nhé.', 'bot'); })
    .catch(function () { w.remove(); add('Kết nối đang chậm hoặc bị gián đoạn. Anh/chị thử lại sau ít phút hoặc gọi hotline ' + HOTLINE + ' ạ.', 'bot'); })
    .then(function () { clearTimeout(to); setBusy(false); });
}

f.addEventListener('submit', function (e) { e.preventDefault(); send(t.value); });
t.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(t.value); } });
t.addEventListener('input', function () { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 110) + 'px'; });

['Tiệm tạp hóa có bắt buộc dùng hóa đơn điện tử không?', 'Bỏ thuế khoán 2026 thì hộ kinh doanh làm gì?', 'Chữ ký số SmartCA dùng thế nào?', 'Tôi muốn được tư vấn và báo giá']
.forEach(function (q) { var b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = function () { send(q); }; chips.appendChild(b); });

add('Chào anh/chị! Em là trợ lý AI của VNPT Chơn Thành. Em có thể giải đáp nhanh về hóa đơn điện tử, chữ ký số và quy định thuế hộ kinh doanh 2026. Anh/chị cần hỗ trợ gì ạ?', 'bot');
})();
</script>
</body>
</html>
