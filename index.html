<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AI Control</title>
<style>
:root{
  --blue:#0B3D91;--blue-2:#1B5FD1;--cyan:#00A3E0;--blue-soft:#E8EFFC;--bg:#EAF0FA;--card:#fff;--line:#E3E9F3;
  --text:#101828;--mute:#667085;--ok:#12805C;--ok-bg:#E6F5EE;--warn:#B25E09;--warn-bg:#FFF3DF;--err:#C0392B;--err-bg:#FDECEA;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 40%,#F6F9FF 0%,#E6EEFB 70%,#D9E5F8 100%);color:var(--text);
  font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
input,select,pre,.res{user-select:text;-webkit-user-select:text}
button{font:inherit;cursor:pointer}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- thanh trên (gọn như app) ---------- */
.top{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;flex:none;box-shadow:0 2px 12px rgba(11,61,145,.25);position:relative;z-index:5}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;max-width:1100px;margin:0 auto;min-height:40px}
.acts{display:flex;gap:8px;justify-self:end}
.logo{justify-self:start;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:20px}
.ttl{text-align:center;white-space:nowrap;line-height:1.2}.ttl b{display:block;font-size:25px;font-weight:800;letter-spacing:.5px}.ttl span{font-size:11.5px;opacity:.8}
.iconbtn{width:36px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:19px;display:grid;place-items:center;position:relative}
.iconbtn .cnt{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#FBBF24;color:#3b2a00;font-size:10.5px;font-weight:800;display:none;place-items:center;padding:0 4px}
.chips{max-width:1100px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:999px;padding:3px 9px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa7bd}.dot.on{background:#4ade80}.dot.warn{background:#fbbf24}
/* ---------- sân khấu sơ đồ ---------- */
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.stage{position:relative;flex:none;--u:4px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.rot{cursor:grabbing}
.node.lift{transform:translate(-50%,-50%) scale(1.18);z-index:6;transition:none;box-shadow:0 0 0 calc(var(--u)*.8) rgba(0,163,224,.5),0 calc(var(--u)*2) calc(var(--u)*5) rgba(11,61,145,.5)}
#rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit{fill:none;stroke:#9DB6E3;stroke-width:.25;stroke-dasharray:1 1.6;opacity:.8}
.glow{fill:url(#gl);stroke:none}
.spoke{stroke:#8FADE0;stroke-width:.45;stroke-dasharray:1.6 1.4;stroke-linecap:round;fill:none}
.spoke.act{stroke:var(--blue-2);stroke-width:.7;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-6}}
.node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.5);
  color:var(--blue);background:#fff;box-shadow:0 0 0 calc(var(--u)*.35) var(--blue),0 calc(var(--u)*1) calc(var(--u)*3) rgba(11,61,145,.22);
  animation:pop .5s cubic-bezier(.2,.9,.3,1.3) backwards;transition:transform .15s,box-shadow .15s}
.node .ni{display:grid;place-items:center;line-height:1}
.node .nl{font-weight:700;text-align:center;line-height:1.12;font-size:max(9px,calc(var(--u)*2.7));padding:0 6%}
.node.ready{color:#fff;background:radial-gradient(circle at 35% 30%,#2D7BEA,var(--blue) 72%);
  box-shadow:0 0 0 calc(var(--u)*.8) rgba(27,95,209,.16),0 calc(var(--u)*1.2) calc(var(--u)*3.4) rgba(11,61,145,.42)}
.node.ready .ni{font-size:calc(var(--u)*7.4);background:rgba(255,255,255,.16);color:#fff;border-radius:50%;padding:calc(var(--u)*.9)}
.node.ready .nb{background:#22C55E;border-color:#fff}
.node.ready.busy::after{border-color:var(--cyan)}
.node.ready:hover{transform:translate(-50%,-50%) scale(1.07)}
.node:active{transform:translate(-50%,-50%) scale(.94)}
.node.soon{background:#F3F6FC;color:#8896B3;box-shadow:0 0 0 calc(var(--u)*.22) #CBD5E8,0 calc(var(--u)*.6) calc(var(--u)*2) rgba(11,61,145,.08)}
.node.soon .ni{font-size:calc(var(--u)*4.6)}
.node.soon .nl{font-size:max(9px,calc(var(--u)*2.3));font-weight:600}
.node .nb{position:absolute;top:6%;right:6%;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;background:#22C55E;border:calc(var(--u)*.4) solid #fff}
.node.soon .nb{display:none}
.node.busy::after,.node.wait::after{content:"";position:absolute;inset:calc(var(--u)*-1.2);border-radius:50%;border:calc(var(--u)*.5) solid var(--blue-2);animation:ring 1.2s ease-out infinite}
.node.wait::after{border-color:#F59E0B}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.12);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.hub{position:absolute;left:50%;top:50%;width:21%;height:21%;transform:translate(-50%,-50%);border-radius:50%;border:0;color:#fff;
  background:radial-gradient(circle at 35% 30%,#2D7BEA,var(--blue) 70%);box-shadow:0 0 0 calc(var(--u)*1) rgba(27,95,209,.16),0 calc(var(--u)*1.4) calc(var(--u)*4) rgba(11,61,145,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hub::before{content:"";position:absolute;inset:calc(var(--u)*-1.6);border-radius:50%;border:calc(var(--u)*.45) solid transparent;border-top-color:var(--cyan);border-right-color:var(--cyan);animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hub b{font-size:calc(var(--u)*4.6);letter-spacing:.5px}
.hub small{font-size:max(9px,calc(var(--u)*2.5));opacity:.92;margin-top:calc(var(--u)*.4);text-align:center;padding:0 8%}
.hub .cnt{position:absolute;top:2%;right:2%;min-width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;background:#FBBF24;color:#3b2a00;font-weight:800;font-size:max(10px,calc(var(--u)*2.6));display:none;place-items:center;border:calc(var(--u)*.4) solid #fff}
/* ---------- thanh ra lệnh dưới cùng ---------- */
.dock{display:none;flex:none;padding:6px 12px 4px;max-width:720px;width:100%;margin:0 auto}
.cmd{display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.cmd input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;padding:8px 0}
.cmd button{width:42px;height:42px;border-radius:50%;border:0;font-size:19px;display:grid;place-items:center;flex:none}
.btn-mic{background:var(--blue-soft);color:var(--blue)}.btn-mic.rec{background:var(--err);color:#fff;animation:pulse 1s infinite}
.btn-go{background:var(--blue);color:#fff}
.hint{font-size:11.5px;color:var(--mute);margin:6px 12px 0;text-align:center}
@keyframes pulse{50%{opacity:.6}}
/* ---------- danh sách việc (trong cửa sổ) ---------- */
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:20px 2px 4px;font-weight:700}
.job{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.job:last-child{border:0}
.job .ji{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:19px}
.job .jt{flex:1;min-width:0}.job .jt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .jt span{font-size:12px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.queued,.tag.running{background:var(--blue-soft);color:var(--blue)}
.tag.await_confirm{background:var(--warn-bg);color:var(--warn)}
.tag.confirmed{background:var(--blue-soft);color:var(--blue)}
.tag.done{background:var(--ok-bg);color:var(--ok)}.tag.error{background:var(--err-bg);color:var(--err)}.tag.cancelled{background:#EEF1F6;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:18px 0;font-size:13px}
/* ---------- cửa sổ: trượt từ dưới (điện thoại) / ngăn bên phải (máy tính) ---------- */
.back{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:#fff;border-radius:22px 22px 0 0;z-index:21;
  max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:42px;height:4px;border-radius:4px;background:#D0D5DD;margin:6px auto 14px}
@media (min-width:900px){
  .sheet{left:auto;right:0;top:0;bottom:0;max-width:440px;width:440px;max-height:none;border-radius:0;transform:translateX(105%);padding:22px 24px;box-shadow:-8px 0 30px rgba(16,24,40,.18)}
  .sheet.open{transform:none}.grab{display:none}.back{background:rgba(16,24,40,.25)}
}
.sh-h{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.sh-h .ic{width:44px;height:44px;border-radius:13px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:23px}
.sh-h b{font-size:18px;color:var(--blue)}.sh-d{color:var(--mute);font-size:13px;margin:2px 0 8px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
label i{color:var(--err);font-style:normal}
.sheet input,.sheet select{width:100%;border:1px solid #D0D5DD;border-radius:12px;padding:13px 12px;font-size:16px;background:#fff;color:var(--text);outline:none}
.sheet input:focus,.sheet select:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(27,95,209,.14)}
.sub{font-size:12px;color:var(--mute);margin-top:4px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;margin-top:18px;background:var(--blue);color:#fff}
.btn.sec{background:var(--blue-soft);color:var(--blue);margin-top:10px}.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.ok{background:var(--ok);color:#fff}.btn:disabled{opacity:.55}
.note{border-radius:12px;padding:11px 12px;font-size:13px;margin-top:14px;background:var(--warn-bg);color:#7A4306}
.note.info{background:var(--blue-soft);color:#12326B}.note.err{background:var(--err-bg);color:#8E2A20}
pre.res{white-space:pre-wrap;word-break:break-word;background:#F8FAFD;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Consolas,monospace;margin:10px 0 0;max-height:260px;overflow:auto}
.steps{display:flex;gap:4px;margin:14px 0 4px}.steps i{flex:1;height:5px;border-radius:5px;background:#E3E9F3}.steps i.on{background:var(--blue-2)}.steps i.fin{background:var(--ok)}.steps i.bad{background:var(--err)}
.link{display:flex;gap:8px;align-items:center;background:var(--ok-bg);color:var(--ok);padding:12px;border-radius:12px;margin-top:10px;font-weight:700;text-decoration:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101828;color:#fff;padding:11px 16px;border-radius:14px;
  font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
.hide{display:none!important}
.dock.open{display:block;animation:dockIn .22s ease-out}@keyframes dockIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Mọi nút chức năng: cùng kích thước, cùng nền xanh VNPT (chấm xanh lá chỉ có ở nút đã nối) */
.node.soon{color:#fff;background:radial-gradient(circle at 35% 30%,#2D7BEA,var(--blue) 72%);
  box-shadow:0 0 0 calc(var(--u)*.8) rgba(27,95,209,.16),0 calc(var(--u)*1.2) calc(var(--u)*3.4) rgba(11,61,145,.42)}
.node.soon:hover{transform:translate(-50%,-50%) scale(1.07)}
.node.ready .ni,.node.soon .ni{font-size:calc(var(--u)*5.6);background:rgba(255,255,255,.16);color:#fff;border-radius:50%;padding:calc(var(--u)*.7)}
.node.ready .nl,.node.soon .nl{font-size:max(9px,calc(var(--u)*2.45));font-weight:700;padding:0 5%}
.node.soon{opacity:.86}
.gm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-top:10px;color:var(--text)}
.gm .ic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:21px;flex:none}
.gm b{display:block;font-size:15px;color:var(--blue)}.gm small{display:block;font-size:12px;color:var(--mute);margin-top:2px}.gm i{margin-left:auto;font-style:normal;font-size:22px;color:var(--mute)}
.pwr{flex:none;text-align:center;font-size:11.5px;color:var(--mute);letter-spacing:.3px;padding:4px 0 calc(10px + env(safe-area-inset-bottom))}
.pwr b{color:var(--blue);font-weight:700}
/* Hỗ trợ khách */
.ht-card{background:#F8FAFD;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.ht-card h4{margin:0 0 4px;font-size:14px;color:var(--blue)}
.ht-it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff}
.ht-it .id{font:700 18px/1.1 ui-monospace,Consolas,monospace;color:var(--blue);letter-spacing:.5px}
.ht-it .mt{font-size:12px;color:var(--mute)}
.ht-it .b1{margin-left:auto;border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
.ht-it .b2{border:0;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 11px;font-weight:700}
@media (prefers-reduced-motion:reduce){.node,.hub::before,.spoke.act,.node.busy::after,.node.wait::after{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo" id="logo"></div>
    <div class="ttl"><b>AI Control</b></div>
    <div class="acts"><button class="iconbtn" id="installBox" aria-label="Cài app lên màn hình chính" title="Cài app" style="display:none"></button>
    <button class="iconbtn" id="btnAct" aria-label="Hoạt động gần đây"><span class="cnt" id="cntTop"></span></button>
    <button class="iconbtn" id="btnSet" aria-label="Cài đặt"></button></div>
  </div>
  <div class="chips">
    <span class="chip"><i class="dot" id="dBack"></i><span id="tBack">Đang kiểm tra…</span></span>
    <span class="chip"><i class="dot" id="dAgent"></i><span id="tAgent">Máy tính</span></span>
    <span class="chip"><i class="dot" id="dExt"></i><span id="tExt">Chrome</span></span>
  </div>
</header>

<div id="stageWrap">
  <div class="stage" id="stage">
    <svg id="rings" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div id="nodes"></div>
    <button class="hub" id="hub" aria-label="Nhập lệnh cho AI Control"><b>AI</b><small id="hubTxt">Control</small><span class="cnt" id="cntHub"></span></button>
  </div>
</div>

<footer class="dock">
  <form class="cmd" id="cmdForm">
    <input id="cmdInput" placeholder="Ra lệnh: báo giá van 100 cho 3801284888" autocomplete="off" enterkeyhint="send">
    <button type="button" class="btn-mic" id="btnMic" aria-label="Nói"></button>
    <button class="btn-go" aria-label="Gửi" id="btnGo"></button>
  </form>
  <p class="hint" id="cmdHint">Chạm để mở · kéo để xoay vòng · giữ rồi kéo để đổi chỗ</p>
</footer>
<div class="pwr" id="pwr">Powered by <b>Biểu ViO</b></div>

<div class="back" id="back"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   1. ICON (SVG nội tuyến, phong cách nét mảnh)
   ===================================================================== */
var IC = {
  quote:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/>',
  contract:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 17c1.5-3 2.5-3 3-1s1.5 1.5 3-1"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/>',
  upload:'<path d="M12 16V5M7.5 9.5 12 5l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  download:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  send:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5L21 12.5 12.5 21 3 11.5 11.5 3z" transform="scale(.8) translate(3 3)"/><path d="M9 15l-4 4"/>',
  word:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M8.5 12l1.5 6 2-5 2 5 1.5-6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  spark:'<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>',
  headset:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20a4 4 0 0 1-4 2h-2"/>',
  bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/>',

var CFG = {url:"", token:""};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function loadCfg(){
  try{ var c=JSON.parse(lsGet("aic_cfg")||"{}"); CFG.url=c.url||""; CFG.token=c.token||""; }catch(e){}
}
function saveCfg(url, token){ CFG.url=(url||"").trim(); CFG.token=(token||"").trim(); lsSet("aic_cfg", JSON.stringify(CFG)); }
function importCfgFromHash(){
  var m=(location.hash||"").match(/cfg=([A-Za-z0-9+\/=_-]+)/); if(!m) return false;
  try{
    var o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    if(o.u && o.t){ saveCfg(o.u,o.t); history.replaceState(null,"",location.pathname); return true; }
  }catch(e){}
  return false;
}
function connected(){ return !!(CFG.url && CFG.token); }

/* =====================================================================
   4. GỌI BACKEND (fetch POST text/plain để tránh lỗi CORS của Apps Script)
   ===================================================================== */
function api(action, data){
  if(!connected()) return Promise.reject(new Error("Chưa kết nối backend"));
  var body = JSON.stringify(Object.assign({token:CFG.token, action:action}, data||{}));
  return fetch(CFG.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body, redirect:"follow"})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||"Lỗi backend"); return j; });
}

   Thêm tool mới ở mảng TOOLS, sơ đồ tự xếp lại vị trí. */
function polar(r,deg){ var a=deg*Math.PI/180; return [50+r*Math.cos(a), 50+r*Math.sin(a)]; }
/* Bố cục sơ đồ do người dùng sắp xếp (xoay vòng / đổi chỗ), lưu trong localStorage "aic_lay". */
var INNER_FIX=["bao_gia","hop_dong_web","cong_no","tim_file","vnedu_admin"];   // 5 nút vòng trong, không thêm bớt
var RING={ "in":{r:25,d:15.5,start:-90,key:"rIn"}, "out":{r:42,d:15.5,start:-67.5,key:"rOut"} };
var LAY={"in":[],"out":[],rIn:0,rOut:0}, dragNode=null, suppressUntil=0, G=null;
function loadLay(){
  var l=null; try{ l=JSON.parse(lsGet("aic_lay")||"null"); }catch(e){}
  l=l||{}; LAY={"in":l["in"]||[],"out":l.out||[],rIn:+l.rIn||0,rOut:+l.rOut||0};
  // Vòng trong CỐ ĐỊNH 5 nút (INNER_FIX). Mọi tool khác (kể cả tool mới) luôn nằm vòng ngoài.
  var rd=TOOLS.filter(function(t){return INNER_FIX.indexOf(t.id)>=0 && !t.parent && !t.hidden;}).map(function(t){return t.id;});
  var sn=TOOLS.filter(function(t){return INNER_FIX.indexOf(t.id)<0 && !t.parent && !t.hidden;}).map(function(t){return t.id;});
  // giữ thứ tự đã lưu, bỏ tool không còn, thêm tool mới vào cuối
  LAY["in"]=LAY["in"].filter(function(id){return rd.indexOf(id)>=0;}).concat(rd.filter(function(id){return LAY["in"].indexOf(id)<0;}));
  LAY.out=LAY.out.filter(function(id){return sn.indexOf(id)>=0;}).concat(sn.filter(function(id){return LAY.out.indexOf(id)<0;}));
}
function saveLay(){ lsSet("aic_lay",JSON.stringify(LAY)); }
function placeAll(){
  ["in","out"].forEach(function(k){
    var cfg=RING[k], arr=LAY[k];
    arr.forEach(function(id,i){
      var pos=polar(cfg.r, cfg.start+LAY[cfg.key]+i*360/arr.length);
      var nd=el("nd_"+id), sp=el("sp_"+id);
      if(nd && nd!==dragNode){ nd.style.left=pos[0].toFixed(2)+"%"; nd.style.top=pos[1].toFixed(2)+"%"; }
      if(sp){ sp.setAttribute("x2",pos[0].toFixed(2)); sp.setAttribute("y2",pos[1].toFixed(2)); }
    });
  });
}

/* Hoạt ảnh xoay nhẹ về vị trí khớp ô gần nhất */
function snapRing(k){
  var cfg=RING[k], n=LAY[k].length||1, step=360/n, from=LAY[cfg.key], to=Math.round(from/step)*step, t0=performance.now();
  function f(t){ var q=Math.min(1,(t-t0)/180); q=1-Math.pow(1-q,3); LAY[cfg.key]=from+(to-from)*q; placeAll(); if(q<1) requestAnimationFrame(f); else { LAY[cfg.key]=((to%360)+360)%360; placeAll(); saveLay(); } }
  requestAnimationFrame(f);
}
/* Kéo để xoay vòng; giữ ~0,5 giây rồi kéo để đổi chỗ với biểu tượng khác cùng vòng */
(function(){
  var st=el("stage");
  function end(e,cancel){
    window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cn);
    if(!G) return; clearTimeout(G.timer); st.classList.remove("rot");
    var g=G; G=null;
    if(g.mode==="rot"){ suppressUntil=Date.now()+350; snapRing(g.key); }
    else if(g.mode==="swap"){
      suppressUntil=Date.now()+350;
      var tg=null; if(!cancel){ var u=document.elementFromPoint(e.clientX,e.clientY); tg=u&&u.closest?u.closest(".node"):null; }
      var nd=g.nd; nd.classList.remove("lift"); nd.style.pointerEvents=""; dragNode=null;
      if(tg && tg!==nd && tg.getAttribute("data-ring")===nd.getAttribute("data-ring")){
        var arr=LAY[g.key], i1=arr.indexOf(nd.dataset.t), i2=arr.indexOf(tg.dataset.t);
        if(i1>=0&&i2>=0){ var x=arr[i1]; arr[i1]=arr[i2]; arr[i2]=x; saveLay(); toast("Đã đổi chỗ"); }
      }
      placeAll();
    }
  }
  function mv(e){
    if(!G) return;
    if(!G.mode && Math.hypot(e.clientX-G.x0,e.clientY-G.y0)>8){ clearTimeout(G.timer); G.mode="rot"; st.classList.add("rot"); }
    if(G.mode==="rot"){
      var a=Math.atan2(e.clientY-G.cy,e.clientX-G.cx), d=a-G.prev; if(d>Math.PI) d-=2*Math.PI; if(d<-Math.PI) d+=2*Math.PI;
      G.prev=a; G.acc+=d; LAY[RING[G.key].key]=G.rot0+G.acc*180/Math.PI; placeAll();
    } else if(G.mode==="swap"){
      var rc=st.getBoundingClientRect();
      G.nd.style.left=((e.clientX-rc.left)/rc.width*100).toFixed(2)+"%"; G.nd.style.top=((e.clientY-rc.top)/rc.height*100).toFixed(2)+"%";
    }
  }
  function up(e){ end(e,false); } function cn(e){ end(e,true); }
  st.addEventListener("pointerdown",function(e){
    if(e.button>0 || e.target.closest(".hub")) return;
    var rc=st.getBoundingClientRect(), cx=rc.left+rc.width/2, cy=rc.top+rc.height/2;
    var nd=e.target.closest(".node"), dist=Math.hypot(e.clientX-cx,e.clientY-cy)/(rc.width/2)*50;
    if(!nd && dist>50) return;
    var key = nd ? (nd.getAttribute("data-ring")==="out"?"out":"in") : (dist<33.5?"in":"out");
    var a0=Math.atan2(e.clientY-cy,e.clientX-cx);
    G={nd:nd,key:key,cx:cx,cy:cy,x0:e.clientX,y0:e.clientY,prev:a0,acc:0,rot0:LAY[RING[key].key],mode:"",timer:null};
    if(nd) G.timer=setTimeout(function(){ if(G && !G.mode){ G.mode="swap"; dragNode=G.nd; G.nd.classList.add("lift"); G.nd.style.pointerEvents="none"; if(navigator.vibrate) navigator.vibrate(15); } },450);
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",cn);
  });
})();

/* ---------- Tìm file: vẽ danh sách kết quả + nút Lấy file / Xem thư mục ---------- */
var FILES_TAG="§FILES§", NOI_VN={d:"Ổ D",downloads:"Downloads",desktop:"Desktop"};
function parseFiles(j){
  var s=String(j.ket_qua||""); if(j.tool!=="tim_file" || s.indexOf(FILES_TAG)!==0) return null;
  try{ return JSON.parse(s.slice(FILES_TAG.length)); }catch(e){ return null; }
}
function fileIcon(it){
  if(it.d) return "folder";
  var e=(String(it.n).split(".").pop()||"").toLowerCase();
  if(e==="pdf") return "quote"; if(/^(doc|docx|rtf|odt)$/.test(e)) return "word"; if(/^(xls|xlsx|xlsm|csv)$/.test(e)) return "chart";
  return "file";
}
function fmtSize(n){ n=+n||0; return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"; }
function dirOf(p){ p=String(p); var i=Math.max(p.lastIndexOf("\\"),p.lastIndexOf("/")); return i>0?p.slice(0,i):p; }
function fileListHtml(fl){
  var head=fl.trong?"Trong thư mục: "+esc(fl.trong):"Tìm “"+esc(fl.q)+"”";
  var h='<p class="sh-d">'+head+' · '+(+fl.n||0)+' kết quả'+(fl.n>fl.items.length?' (hiện '+fl.items.length+' khớp nhất)':'')+'</p>';
  if(!fl.items.length) return h+'<div class="empty">Không thấy file nào. Thử từ khóa ngắn hơn, ví dụ chỉ tên riêng của khách.</div>';
  h+=fl.items.map(function(it,i){
    var big=!it.d && it.s>10*1048576;
    var meta=(NOI_VN[it.r]||it.r)+" · "+(it.d?"Thư mục":fmtSize(it.s))+(it.t?" · "+it.t:"")+(big?" · quá 10 MB":"");
    return '<button class="gm fr" data-i="'+i+'"'+(big?' data-big="1"':'')+'><span class="ic">'+svg(fileIcon(it))+'</span>'+
      '<span style="min-width:0"><b style="word-break:break-word">'+esc(it.n)+'</b><small style="word-break:break-all">'+esc(dirOf(it.p))+'</small><small>'+esc(meta)+'</small></span><i>'+(it.d?"›":"⤓")+'</i></button>';
  }).join("");
  return h+'<div class="note info">Bấm vào file để lấy về điện thoại (tối đa 10 MB). Bấm vào thư mục để xem bên trong.</div>';
}
function bindFileList(j){
  var fl=parseFiles(j); if(!fl) return;
  Array.prototype.forEach.call(document.querySelectorAll(".fr"), function(b){
    b.onclick=function(){
      var it=fl.items[+b.getAttribute("data-i")]; if(!it) return;
      if(b.getAttribute("data-big")){ toast("File lớn hơn 10 MB, anh mở trên máy tính"); return; }
      var t=toolById(it.d?"tim_file":"lay_file"), p=it.d?{trong:it.p}:{path:it.p};
      b.disabled=true;
      submitJob(t,p).then(function(r){ toast(it.d?"Đang mở thư mục…":"Đang lấy file từ máy tính…"); if(r&&r.id) setTimeout(function(){ openJob(r.id); },300); })
        .catch(function(e){ b.disabled=false; toast("Lỗi: "+e.message); });
    };
  });
}

/* ---------- chi tiết một việc ---------- */
var FLOW = ["queued","running","await_confirm","done"];

function renderJobSheet(first){
  var j=JOBS.filter(function(x){return x.id===openJobId;})[0]; if(!j){ return; }

  if(st==="running"||st==="confirmed") h+='<p class="sh-d">Máy tính đang xử lý, màn hình tự cập nhật.</p>';
  var isKh = j.tool==="hop_dong_web" && st==="await_confirm" && String(j.ket_qua||"").indexOf("⏸KHDN")===0;
  var fl=parseFiles(j);
  var isVnSel = j.tool==="vnedu_serial" && st==="await_confirm";
  if(isVnSel) h+='<pre class="res" id="vnSum">'+esc(VN_DS["_s_"+j.id]||(j.cat_bot?"":String(j.ket_qua||"").split("§DS§")[0])||"Đang tải kết quả quét…")+'</pre><div id="vnList"></div>';
  else if(j.cat_bot) h+='<div class="note info">Kết quả này dài, xem trong màn My Computer.</div><button class="btn" id="btnExOpen">Mở My Computer</button>';
  else if(fl) h+=fileListHtml(fl);                       // Tìm file: danh sách bấm được thay cho khung chữ
  else if(j.ket_qua) h+='<pre class="res">'+esc(String(j.ket_qua).replace(/^⏸KHDN\s*/,"⏸ "))+'</pre>';
  if(j.link_file){
    // File trên Drive: nút chính = TẢI THẲNG file (.docx/.pdf) về điện thoại; nút phụ = mở xem trên Drive.
    var kind=(String(j.ket_qua||"").match(/\.(docx|pdf)\b/i)||[])[1]; kind=kind?kind.toLowerCase():"";
    var kindTxt=kind==="docx"?"Tải file Word (.docx)":(kind==="pdf"?"Tải file PDF":"Tải file kết quả");
    String(j.link_file).split(" ").filter(Boolean).forEach(function(u){
      var m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
      if(m) h+='<a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://drive.google.com/uc?export=download&id='+esc(m[1])+'" rel="noopener">'+svg("download")+' '+kindTxt+'</a>';
      if(m) h+='<button class="btn ok btnShare" data-fid="'+esc(m[1])+'" data-kind="'+kind+'">'+svg("share")+' Chia sẻ qua Zalo</button>';
      h+='<a class="link" href="'+esc(u)+'" target="_blank" rel="noopener">'+svg("link")+' Mở xem trên Drive</a>';
    });
  }
  if(st==="await_confirm"){
    var txt = j.tool==="phan_loai"?"Chạy thật (copy file)":"Xác nhận, tiếp tục";
    if(j.tool==="hop_dong_web") { if(isKh){ h+='<div class="note">Khách hàng chưa có trong hệ thống. Máy tính đã điền sẵn form tạo khách hàng. Bấm nút bên dưới để máy tính TỰ bấm “Lưu”; lưu xong máy sẽ tự tạo hợp đồng và báo lại ở đây.</div>'; txt="Lưu khách hàng"; } else { h+='<div class="note">Hợp đồng đã được điền sẵn trên Chrome của máy tính. Bấm nút bên dưới để máy tính TỰ bấm “Hoàn thành” → “Lưu” trên hopdong.vnpt.vn.</div>'; txt="Xác nhận & Lưu hợp đồng"; } }
    if(j.tool==="vnedu_serial") h+='<button class="btn danger" id="btnNo">Hủy việc này</button>';
    else h+='<button class="btn ok" id="btnYes">'+txt+'</button><button class="btn danger" id="btnNo">Hủy việc này</button>';
  }
  // Lệnh lỗi/đã hủy: chạy lại ngay với đúng dữ liệu cũ, khỏi nhập lại từ đầu
  // Lệnh treo quá 3 phút không có cập nhật (máy tắt/extension kẹt) cũng cho chạy lại
  var stale=false; try{ var tt=new Date(String(j.cap_nhat||j.thoi_gian).replace(" ","T")).getTime(); stale=(st==="running"||st==="queued"||st==="confirmed") && tt && (Date.now()-tt>180000); }catch(e){}
  if(stale) h+='<div class="note">Lệnh này đã hơn 3 phút chưa có cập nhật từ máy tính. Có thể máy đang kẹt hoặc đã tắt.</div>';
  if((st==="error"||st==="cancelled"||stale) && j.params && typeof j.params==="object") h+='<button class="btn" id="btnRetry">Chạy lại</button>';
  h+='<button class="btn sec" id="btnClose2">Đóng</button>';
  var sh=el("sheet");
  if(first || !el("btnClose2")){ openSheet(h); } else { sh.innerHTML='<div class="grab"></div>'+h; }
  // Bấm Đóng = DỪNG lệnh nếu lệnh đang treo (quá 3 phút không cập nhật) hoặc là vnEdu Serial đang chờ/chạy → không còn cảnh báo nữa.
  el("btnClose2").onclick=function(){
    var active=["queued","running","await_confirm","confirmed"].indexOf(st)>=0;
    if(active && connected() && (stale || j.tool==="vnedu_serial")){
      api("job.update",{id:j.id, trang_thai:"cancelled", ket_qua:"Đã dừng từ điện thoại"}).then(function(){ toast("Đã dừng lệnh"); refreshJobs(); }).catch(function(){});
    }
    closeSheet();
  };
  bindFileList(j);
  if(el("btnExOpen")) el("btnExOpen").onclick=function(){ var p=j.params||{}; openExplorer(p.trong?{path:p.trong}:(p.path?{path:dirOf(p.path)}:{})); };
  // Chia sẻ file kết quả (Word/PDF) qua Zalo: lấy file từ backend rồi mở bảng chia sẻ của điện thoại
  Array.prototype.forEach.call(document.querySelectorAll(".btnShare"), function(b){
    var cache=null, label=b.innerHTML;
    b.onclick=function(){
      function doShare(){
        var f=cache.file;
        if(navigator.canShare && navigator.canShare({files:[f]})){
          return navigator.share({files:[f], title:f.name}).then(function(){ b.innerHTML=label; })
            .catch(function(e){
              if(e && e.name==="AbortError"){ b.innerHTML=label; return; }          // người dùng đóng bảng chia sẻ
              if(e && e.name==="NotAllowedError"){ b.innerHTML="Bấm lần nữa để chia sẻ"; return; } // hết "lượt bấm" sau khi tải
              throw e;
            });
        }
        // Trình duyệt không hỗ trợ chia sẻ file: tải về để gửi tay
        var a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
        toast("Máy không hỗ trợ chia sẻ trực tiếp, đã tải file về."); b.innerHTML=label; return Promise.resolve();
      }
      if(cache){ doShare().catch(function(e){ toast("Lỗi: "+e.message); b.innerHTML=label; }); return; }
      b.disabled=true; b.textContent="Đang chuẩn bị file…";
      api("file.get",{file_id:b.getAttribute("data-fid")}).then(function(r){
        var bin=atob(r.b64), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        cache={file:new File([arr], r.name, {type:r.mime})};
        b.disabled=false; return doShare();
      }).catch(function(e){
        b.disabled=false; b.innerHTML=label;
        toast(/Action không hợp lệ/.test(e.message)?"Cần cập nhật Apps Script (thêm file.get)":"Lỗi: "+e.message);
      });
    };
  });
  if(el("btnRetry")) el("btnRetry").onclick=function(){
    var b=el("btnRetry"); b.disabled=true; b.textContent="Đang gửi lại…";
    submitJob(t, JSON.parse(JSON.stringify(j.params))).then(function(r){ toast("Đã gửi lại lệnh"); if(r&&r.id) setTimeout(function(){ openJob(r.id); },300); })
      .catch(function(e){ b.disabled=false; b.textContent="Chạy lại"; toast("Lỗi: "+e.message); });
  };
  if(isVnSel) vnSelRender(j);
  if(el("btnYes")) el("btnYes").onclick=function(){ answer(j.id,true); };
  if(el("btnNo")) el("btnNo").onclick=function(){ answer(j.id,false); };
}
/* ---------- vnEdu Serial: bảng chọn TỪNG giáo viên cần cập nhật ----------
   Danh sách lấy từ kết quả quét (dòng §DS§ do máy tính gửi). Mặc định KHÔNG tích ai.
   Chỉ dòng "cần cập nhật" mới tích được. Bấm Cập nhật → ghi §CHON§[id…] rồi xác nhận;
   máy tính chỉ ghi đúng những người này, không đụng giáo viên khác. */
var VN_DS={}, VN_SEL={}, VN_Q="", VN_SCROLL={}, VN_QF=false;
function vnNorm(x){ return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase(); }
function vnSelRender(j){
  var box=el("vnList"); if(!box) return;
  var ds=VN_DS[j.id];
  if(!ds){
    var raw=String(j.ket_qua||""), k=raw.indexOf("§DS§");

    if(!ds){
      box.innerHTML='<div class="note info">Đang tải danh sách giáo viên…</div>';
      if(!VN_DS["_ld_"+j.id]){ VN_DS["_ld_"+j.id]=1;
        api("job.get",{id:j.id}).then(function(r){ var t=String(r.job.ket_qua||""), i=t.indexOf("§DS§"); VN_DS[j.id]=i>=0?JSON.parse(t.slice(i+4)):[]; VN_DS["_s_"+j.id]=i>=0?t.slice(0,i):t; if(el("vnSum")) el("vnSum").textContent=VN_DS["_s_"+j.id]; vnSelRender(j); })
          .catch(function(e){ VN_DS["_ld_"+j.id]=0; box.innerHTML='<div class="note">Không tải được danh sách: '+esc(e.message)+'</div>'; });
      }
      return;
    }
  }
  var sel=VN_SEL[j.id]||(VN_SEL[j.id]={});
  var LBL={need:["Cần cập nhật","#c62828"],ok:["Đã dùng serial mới nhất","#2e7d32"],manual:["Có 2 serial cùng ngày, cần chọn tay trên máy","#e65100"],nocert:["Chưa có chứng thư hợp lệ","#777"],notk:["Chưa có tài khoản ký số","#777"],err:["Không đọc được serial (vnEdu không trả dữ liệu) — kiểm tra tay trên máy","#e65100"]};
  var q=vnNorm(VN_Q), shown=ds.filter(function(x){ return !q || vnNorm(x.n).indexOf(q)>=0; });
  var nNeed=ds.filter(function(x){return x.t==="need";}).length, nSel=Object.keys(sel).filter(function(k){return sel[k];}).length;
  var h='<div class="fld" style="margin-top:8px"><input id="vnQ" type="text" placeholder="Tìm theo tên (gõ không dấu được)…" value="'+esc(VN_Q)+'"></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:4px 0 8px">'+
    '<span>Hiển thị '+shown.length+'/'+ds.length+' · cần cập nhật '+nNeed+'</span>'+
    (nNeed?'<span><a href="#" id="vnAll" style="margin-right:10px">Chọn hết cần cập nhật</a><a href="#" id="vnNone">Bỏ chọn</a></span>':'')+'</div>'+
    '<div id="vnScroll" style="max-height:46vh;overflow:auto;border:1px solid #e3e9f4;border-radius:10px;overscroll-behavior:contain">';
  h+=shown.map(function(x){
    var lb=LBL[x.t]||[x.t,"#777"], can=x.t==="need", on=can&&sel[x.k];
    var line2=x.t==="need"?('Serial: '+esc(x.c||"(trống)")+' → <b style="color:#1565c0">'+esc(x.m||"")+'</b>'+(x.h?' · đến '+esc(x.h):'')):
      ('Serial: '+esc(x.c||"(trống)")+(x.h?' · HH: <b style="color:#2e7d32">'+esc(x.h)+'</b>':''));
    return '<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #eef2f8;'+(can?'cursor:pointer':'opacity:.75')+'">'+
      '<input type="checkbox" data-vk="'+esc(x.k)+'" '+(on?'checked ':'')+(can?'':'disabled ')+'style="width:20px;height:20px;margin-top:2px;flex:none">'+
      '<span style="flex:1;min-width:0"><b>'+esc(x.n)+'</b><br><span style="font-size:13px;color:#555">'+line2+'</span><br><span style="font-size:12.5px;color:'+lb[1]+'">'+esc(lb[0])+'</span></span></label>';
  }).join("")||'<div class="note info" style="margin:10px">Không có giáo viên khớp.</div>';
  h+='</div><button class="btn ok" id="vnGo" '+(nSel?'':'disabled ')+'style="margin-top:10px">'+(nSel?'Cập nhật '+nSel+' giáo viên đã chọn':'Tích chọn giáo viên cần cập nhật')+'</button>';
  box.innerHTML=h;
  // Giữ nguyên vị trí cuộn khi app tự làm mới hoặc khi tích chọn (trước đây bị nhảy về đầu danh sách)
  var sc=el("vnScroll"); sc.scrollTop=VN_SCROLL[j.id]||0; sc.onscroll=function(){ VN_SCROLL[j.id]=sc.scrollTop; };
  var qi=el("vnQ");
  if(VN_QF){ qi.focus(); try{ qi.setSelectionRange(qi.value.length,qi.value.length); }catch(e){} }
  qi.onfocus=function(){ VN_QF=true; }; qi.onblur=function(){ VN_QF=false; };
  qi.oninput=function(){ VN_Q=qi.value; VN_SCROLL[j.id]=0; vnSelRender(j); };
  // Tích/bỏ tích: chỉ cập nhật nút và số đếm, KHÔNG vẽ lại danh sách
  function updBtn(){
    var n=ds.filter(function(x){ return x.t==="need" && sel[x.k]; }).length, b=el("vnGo"); if(!b) return;
    b.disabled=!n; b.textContent=n?"Cập nhật "+n+" giáo viên đã chọn":"Tích chọn giáo viên cần cập nhật";
  }
  [].forEach.call(box.querySelectorAll("[data-vk]"),function(c){ c.onchange=function(){ sel[c.getAttribute("data-vk")]=c.checked; updBtn(); }; });
  if(el("vnAll")) el("vnAll").onclick=function(e){ e.preventDefault(); ds.forEach(function(x){ if(x.t==="need") sel[x.k]=true; }); [].forEach.call(box.querySelectorAll("[data-vk]:not(:disabled)"),function(c){ c.checked=true; }); updBtn(); };
  if(el("vnNone")) el("vnNone").onclick=function(e){ e.preventDefault(); Object.keys(sel).forEach(function(k){ sel[k]=false; }); [].forEach.call(box.querySelectorAll("[data-vk]"),function(c){ c.checked=false; }); updBtn(); };
  el("vnGo").onclick=function(){
    var keys=ds.filter(function(x){ return x.t==="need" && sel[x.k]; }), b=el("vnGo");
    if(!keys.length){ toast("Chưa chọn giáo viên nào"); return; }
    if(!confirm("Cập nhật serial cho "+keys.length+" giáo viên:\n- "+keys.map(function(x){return x.n;}).join("\n- ")+"\n\nGiáo viên khác KHÔNG bị thay đổi.")) return;
    b.disabled=true; b.textContent="Đang gửi…";
    api("job.update",{id:j.id, trang_thai:"await_confirm", ket_qua:"Đã chọn "+keys.length+" giáo viên: "+keys.map(function(x){return x.n;}).join(", ")+"\n§CHON§"+JSON.stringify(keys.map(function(x){return x.k;}))})
      .then(function(){ answer(j.id,true); })
      .catch(function(e){ b.disabled=false; b.textContent="Cập nhật "+keys.length+" giáo viên đã chọn"; toast("Lỗi: "+e.message); });
  };
}

/* ---------- trạng thái kết nối trên đầu trang ---------- */
function setChip(d,t,state,text){ el(d).className="dot "+state; el(t).textContent=text; }
function ago(s){ return s<90?"vừa xong":(Math.round(s/60)+" phút trước"); }
function pingNow(){
  if(!connected()){ setChip("dBack","tBack","warn","Chế độ Demo"); setChip("dAgent","tAgent","","Máy tính"); setChip("dExt","tExt","","Chrome"); return Promise.resolve(false); }
  return api("ping").then(function(r){
    setChip("dBack","tBack","on","Đã kết nối");
    var a=r.nguoi_thuc_thi.agent, x=r.nguoi_thuc_thi.ext;
    setChip("dAgent","tAgent",a&&a.giay_truoc<60?"on":"warn",a&&a.giay_truoc<60?"Máy tính":"Máy tính: "+(a?ago(a.giay_truoc):"chưa chạy"));
    setChip("dExt","tExt",x&&x.giay_truoc<150?"on":"warn",x&&x.giay_truoc<150?"Chrome":"Chrome: "+(x?ago(x.giay_truoc):"chưa chạy"));
    return true;
  }).catch(function(){ setChip("dBack","tBack","warn","Mất kết nối"); return false; });
}

/* =====================================================================
   HỖ TRỢ KHÁCH HÀNG: gửi tool (zip) cho khách → khách chạy → ID hiện ở đây → bấm Kết nối (mở RustDesk)
   Backend: ho_tro.list / ho_tro.mark (cần TOKEN). Khách báo ID bằng khóa riêng (ho_tro.report).
   ===================================================================== */
var SUP_ZIP="ho-tro/VNPT-HoTro.zip", supTimer=null;
function supZipUrl(){ return new URL(SUP_ZIP, location.href).href; }
function supMsg(){ return "VNPT Chơn Thành – hỗ trợ từ xa miễn phí.\nCách làm: tải file zip, giải nén, bấm đúp VNPT-HoTro.bat, khi có thông báo bấm “Chấp nhận”.\nHotline 0918 203 603"; }
/* Tải sẵn file zip khi mở màn Hỗ trợ: Android chỉ cho mở bảng chia sẻ NGAY trong lúc chạm nút (không được chờ tải xong mới gọi). */
var supFile=null;
function supPrefetch(){
  supFile=null;
  fetch(supZipUrl(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("http"); return r.blob(); })
    .then(function(b){ supFile=new File([b],"VNPT-HoTro.zip",{type:"application/zip"}); }).catch(function(){});
}
/* Bấm nút: mở bảng chia sẻ (chọn Zalo). Gửi đúng file zip nếu máy cho phép, không thì gửi link tải. */
function shareTool(){
  var url=supZipUrl(), msg=supMsg(), data;
  if(supFile && navigator.canShare && navigator.canShare({files:[supFile]})) data={files:[supFile], title:"VNPT Hỗ trợ từ xa", text:msg};
  else data={title:"VNPT Hỗ trợ từ xa", text:msg+"\n"+url};
  if(!navigator.share){ copyText(msg+"\n"+url).then(function(){ toast("Đã sao chép nội dung, dán vào Zalo"); }).catch(function(){ toast("Máy không hỗ trợ chia sẻ, dùng link tải bên dưới"); }); return; }
  navigator.share(data).catch(function(e){
    if(e && e.name==="AbortError") return;                       // anh tự đóng bảng chia sẻ
    copyText(msg+"\n"+url).then(function(){ toast("Không mở được bảng chia sẻ. Đã sao chép nội dung, dán vào Zalo"); })
      .catch(function(){ toast("Không chia sẻ được: "+(e&&e.message||e)); });
  });
}
function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t); }catch(e){}
  return Promise.reject(new Error("no clipboard"));
}
/* Bấm Kết nối: chép ID, rồi mở app RustDesk có sẵn ID (cần đã cài RustDesk). */
function supConnect(id){
  copyText(id).catch(function(){});
  toast("Đang mở RustDesk (ID "+id+")… chờ khách bấm Chấp nhận");
  location.href="rustdesk://connection/new/"+id;
}
function fmtT(v){ var d=new Date(v); if(isNaN(d)) return String(v||"").slice(0,16); function z(n){ return ("0"+n).slice(-2); } return z(d.getDate())+"/"+z(d.getMonth()+1)+" "+z(d.getHours())+":"+z(d.getMinutes()); }
function supRender(items){
  var box=el("supList"); if(!box) return;
  if(!items||!items.length){ box.innerHTML='<p class="sub">Chưa có khách nào chạy tool. Gửi tool cho khách ở bước 1.</p>'; return; }
  box.innerHTML=items.map(function(it){
    var ts=fmtT(it.thoi_gian);
    return '<div class="ht-it"><div><div class="id">'+esc(it.id)+'</div><div class="mt">'+esc(it.may||"")+(it.user?" · "+esc(it.user):"")+" · "+esc(ts)+'</div></div>'+
      '<button class="b1" data-c="'+esc(it.id)+'">Kết nối</button><button class="b2" data-d="'+esc(it.id)+'" aria-label="Xong">✓</button></div>';
  }).join("");
}
function supLoad(){
  if(!connected()) return;
  api("ho_tro.list",{}).then(function(r){ supRender(r.items||[]); }).catch(function(e){
    var b=el("supList"); if(b) b.innerHTML='<div class="note err">Chưa lấy được danh sách: '+esc(e.message)+'. Nếu vừa cập nhật, cần dán Code.gs mới và triển khai lại.</div>';
  });
}
function openSupport(){
  var h='<div class="sh-h"><span class="ic">'+svg("headset")+'</span><div><b>Hỗ trợ khách hàng</b></div></div>'+
    '<p class="sh-d">Miễn phí · khách bấm “Chấp nhận” mới kết nối được.</p>'+
    '<div class="ht-card"><h4>1. Gửi tool cho khách</h4><p class="sub" style="margin:0 0 8px">Chọn Zalo ở bảng chia sẻ. Khách giải nén rồi bấm đúp VNPT-HoTro.bat.</p>'+
    '<button class="btn" id="btnShareTool" style="margin-top:6px">Gửi file zip qua Zalo</button>'+
    '<a class="sub" id="lnkZip" href="'+esc(SUP_ZIP)+'" download style="display:block;text-align:center;margin-top:10px;color:var(--blue-2)">Hoặc tải file zip về máy này</a></div>'+
    '<div class="ht-card"><h4>2. Khách đã chạy tool</h4><div id="supList"><p class="sub">'+(connected()?'Đang tải…':'Chưa kết nối backend nên chưa nhận được ID. Vào Cài đặt để kết nối.')+'</p></div>'+
    '<button class="btn sec" id="btnRd">Mở RustDesk</button></div>'+
    '<div class="note info">Điện thoại cần cài sẵn ứng dụng RustDesk (CH Play). Nút Kết nối sẽ chép ID và mở RustDesk đã điền ID.</div>'+
    '<button class="btn sec" id="btnCloseHt">Đóng</button>';
  openSheet(h);
  el("btnShareTool").onclick=shareTool;
  el("btnRd").onclick=function(){ location.href="rustdesk://"; };
  el("btnCloseHt").onclick=closeSheet;
  el("supList").onclick=function(e){
    var c=e.target.closest("[data-c]"), d=e.target.closest("[data-d]");
    if(c) supConnect(c.getAttribute("data-c"));
    else if(d){ api("ho_tro.mark",{id:d.getAttribute("data-d"),trang_thai:"xong"}).then(supLoad).catch(function(er){ toast(er.message); }); }
  };
  supPrefetch(); clearInterval(supTimer); supLoad(); if(connected()) supTimer=setInterval(supLoad,5000);
}

/* ---------- thanh nhập lệnh: ẩn mặc định, bấm nút AI Control để hiện ---------- */
function toggleCmd(force){

}
